<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat Hunt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: filters on the left rail, decision panels (map + chart + KPIs) up top, ranked list below. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --surface-3: #e4e8ee; --fg: #0f172a; --muted: #64748b; --line: #e2e6ec;
  --accent: #1f4e9a; --accent-fg: #ffffff;
  --good: #1d7a4b; --good-bg: #e2f3ea; --warn: #a86a0c; --warn-bg: #fbefd6; --bad: #b4393b; --bad-bg: #f9e3e3; --info: #2c5fb8; --info-bg: #e4ecfa;
  --display: "Inter Tight", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #161e28; --surface-2: #1f2934; --surface-3: #2a3643; --fg: #e7ecf2; --muted: #93a1b3; --line: #2b3745;
  --accent: #6f9ee6; --accent-fg: #0e141b; --good: #52c489; --good-bg: #163427; --warn: #e3ac4e; --warn-bg: #3a2d12; --bad: #e97373; --bad-bg: #3c1c1c; --info: #86aef0; --info-bg: #1b2a44; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #161e28; --surface-2: #1f2934; --surface-3: #2a3643; --fg: #e7ecf2; --muted: #93a1b3; --line: #2b3745;
  --accent: #6f9ee6; --accent-fg: #0e141b; --good: #52c489; --good-bg: #163427; --warn: #e3ac4e; --warn-bg: #3a2d12; --bad: #e97373; --bad-bg: #3c1c1c; --info: #86aef0; --info-bg: #1b2a44; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; padding-block: 0 48px; padding-inline: 16px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
a { color: var(--accent); }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding-block: 22px 14px; }
header.top h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
header.top .sub { color: var(--muted); margin-top: 3px; font-size: 13.5px; }
.hright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.lang button { background: var(--surface); border: 0; padding: 6px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.newpill { background: var(--good-bg); color: var(--good); font-weight: 700; font-size: 13px; padding: 6px 11px; border-radius: 999px; cursor: pointer; border: 0; }

.layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
aside.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; position: sticky; top: 12px; display: grid; gap: 14px; }
@media (max-width: 900px) { aside.filters { position: static; } }
aside h3, .panel h3 { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 8px; letter-spacing: 0; }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }
.range { display: grid; gap: 4px; font-size: 13px; }
.range label { display: flex; justify-content: space-between; color: var(--muted); }
.range label b { color: var(--fg); font-variant-numeric: tabular-nums; }
.range input { width: 100%; accent-color: var(--accent); }
.toggles { display: grid; gap: 6px; font-size: 13.5px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggles input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.reset { background: none; border: 0; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0; text-align: left; }
aside select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }

.main { display: grid; gap: 16px; min-width: 0; }
.main > * { min-width: 0; }
.jumpnav { display: flex; flex-wrap: wrap; gap: 8px; padding: 3px 0; }
.jumpnav a { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); text-decoration: none; padding: 6px 12px; font-weight: 600; font-size: 12px; }
.decision { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.decision-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.decision h2 { font-size: 20px; }.decision p { margin: 0; color: var(--muted); font-size: 12.5px; }
.decision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 9px; }
.decision-item { border: 1px solid var(--line); border-radius: 9px; padding: 11px; display: grid; gap: 5px; background: var(--surface); text-align: left; cursor: pointer; }
.decision-item:hover, .decision-item:focus-visible { border-color: var(--accent); }
.decision-item strong { line-height: 1.3; }.decision-item .money { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
.decision-item small { color: var(--muted); }
.stale { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn); border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; }
.stale strong { color: var(--warn); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; text-align: left; }
.kpi .v { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.kpi .s { font-size: 12.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1000px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; min-width: 0; }
#map { height: 360px; border-radius: 8px; background: var(--surface-2); }
.leaflet-container { font: inherit; }
.placepin { width: 24px; height: 24px; border-radius: 6px; color: #fff; font: 700 12px/20px var(--display); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.leaflet-tooltip.placelabel { font-weight: 600; padding: 2px 6px; }
.listpin { width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 600 11px/26px var(--display); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer; }
.listpin.dim { opacity: .4; }
.chart svg { width: 100%; height: 360px; display: block; }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .budget { stroke: var(--warn); stroke-dasharray: 4 4; }
.chart .pt { cursor: pointer; stroke: var(--surface); stroke-width: 1.5; }
.chart .pt.dim { opacity: .25; }
.chart .lbl { font-size: 10px; fill: var(--fg); pointer-events: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.sq, .ctable i.sq { border-radius: 3px; }
.legend i.ring-i { background: none; border: 1.5px dashed #1f4e9a; }
.chartmode { margin-bottom: 8px; }
.costs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
.costs h2 { font-size: 20px; }
.costs .intro { margin: 0; color: var(--muted); }
.cost-inputs, .cost-picks { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.cost-inputs label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.cost-inputs input { width: 105px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.cost-picks button { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 5px 8px; cursor: pointer; font-size: 12px; }
.cost-picks button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.cost-rows { display: grid; gap: 12px; }
.cost-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(200px, 2fr) minmax(150px, 180px); gap: 12px; align-items: center; }
.cost-row strong { display: block; font-size: 13px; }
.cost-row small { color: var(--muted); }
.cost-bar { display: flex; width: 100%; height: 24px; overflow: hidden; border-radius: 5px; background: var(--surface-2); }
.cost-detail { margin-top: 3px; color: var(--muted); font-size: 11px; }
.cost-bar span { height: 100%; }
.cost-bar .rent, .cost-key .rent { background: #278778; }.cost-bar .loan, .cost-key .loan { background: #4778c0; }.cost-bar .reserve, .cost-key .reserve { background: #d79736; }
.cost-barwrap { position: relative; }
.cost-limit { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--bad); }
.cost-key i.limit { width: 0; height: 12px; border-left: 2px dashed var(--bad); vertical-align: -2px; }
.cost-total { display: grid; justify-items: end; gap: 3px; }
.cost-total small { color: var(--muted); font-weight: 500; }
.cost-total .fact { white-space: normal; text-align: right; font-weight: 500; }
.cost-row > div:first-child small { display: block; }
.cost-total { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.cost-key { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; }.cost-key i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; }
.cost-note { margin: 0; color: var(--muted); font-size: 12px; }
@media (max-width: 700px) { .cost-row { grid-template-columns: 1fr auto; gap: 5px; }.cost-graph { grid-column: 1 / -1; grid-row: 2; }.cost-total { grid-column: 2; grid-row: 1; } }

.updates { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
.updates ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
.updates li { display: flex; gap: 10px; align-items: baseline; }
.updates .d { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 78px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
.tag.new { background: var(--good-bg); color: var(--good); }
.tag.price { background: var(--info-bg); color: var(--info); }
.tag.gone { background: var(--bad-bg); color: var(--bad); }
.tag.sent, .tag.reply, .tag.skipped { background: var(--info-bg); color: var(--info); }
.tag.back { background: var(--warn-bg); color: var(--warn); }
.tag.out{background:var(--warn);color:#fff}.tag.flag{background:var(--bad);color:#fff;cursor:help}.crit.flags{border-left-color:var(--bad)}.crit.flags li{margin-bottom:3px}.crit{border-left:3px solid var(--warn);padding:6px 10px;margin:0 0 10px}.crit ul{margin:4px 0 0 18px}

.listhead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.listhead h2 { font-size: 20px; }
.listhead .actions { display: flex; gap: 8px; align-items: center; }
.more { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 8px 12px; cursor: pointer; font-weight: 600; }
.cards { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card.is-out { opacity: .55; }
.card.open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row { display: grid; grid-template-columns: 128px 1fr auto; gap: 14px; align-items: center; padding: 10px 12px 10px 10px; cursor: pointer; }
.row:hover { background: var(--surface-2); }
.thumbwrap { position: relative; }
.row .thumb { width: 128px; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; display: block; background: var(--surface-2); max-width: 100%; }
.badge-new { position: absolute; top: 6px; left: 6px; }
.ph { display: grid; place-items: center; color: var(--muted); background: var(--surface-2); border-radius: 6px; aspect-ratio: 4/3; }
.ph svg { width: 44%; max-width: 72px; height: auto; opacity: .7; }
.row .thumb.ph { display: grid; }
.photos .mainimg.ph { display: grid; border-radius: 0; width: 100%; }
.welcome { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 10px; justify-items: start; }
.welcome h2 { font-size: 22px; }
.welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 6px; }
.welcome-actions .btn { height: 40px; padding: 0 18px; border-radius: 999px; font-size: 14px; }
.ring.est .n { font-size: 15px; }
.rowmain { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; }
.rowmain h2 { font-size: 16.5px; font-weight: 600; line-height: 1.25; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.rowmain h2 .ctype { font: 500 11.5px/1 var(--body); letter-spacing: 0; padding: 4px 7px; border-radius: 5px; background: var(--info-bg); color: var(--info); }
.rowmain h2 .ctype.p { background: var(--surface-3); color: var(--muted); }
.rowmain .line2 { color: var(--muted); font-size: 13px; }
.rowmain .line2 b { color: var(--fg); font-weight: 600; }
.facts { display: flex; flex-wrap: wrap; gap: 5px 6px; }
.fact { font-size: 12.5px; padding: 3px 8px; border-radius: 6px; font-weight: 500; background: var(--surface-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fact.good { background: var(--good-bg); color: var(--good); } .fact.warn { background: var(--warn-bg); color: var(--warn); } .fact.bad { background: var(--bad-bg); color: var(--bad); }
.fact.unk { background: var(--surface-2); color: var(--muted); white-space: normal; text-align: left; }
.fact.stale { border: 1px dashed var(--warn); }
.linkish { border: 0; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
.cost-note .linkish { background: none; color: var(--accent); padding: 0; font-size: 12px; }
.fact.price { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
.rowside { display: grid; grid-template-columns: auto auto; gap: 6px 12px; align-items: center; justify-items: end; }
.ring { width: 56px; height: 56px; position: relative; grid-row: span 2; }
.ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.ring .bg { fill: none; stroke: var(--surface-3); stroke-width: 5; }
.ring .fg { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring .n { position: absolute; inset: 0; display: grid; place-items: center; font: 600 17px var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--fg); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.s-new { background: var(--surface-2); color: var(--muted); }
.pill.s-contacted, .pill.s-viewing-done, .pill.s-applied { background: var(--info-bg); color: var(--info); }
.pill.s-viewing-invited, .pill.s-docs-requested { background: var(--warn-bg); color: var(--warn); }
.pill.s-accepted { background: var(--good-bg); color: var(--good); }
.pill.s-rejected, .pill.s-dropped, .pill.s-gone { background: var(--bad-bg); color: var(--bad); }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
.pick input { accent-color: var(--good); width: 15px; height: 15px; margin: 0; }
.pick.on { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.compare-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.compare-toggle[aria-pressed="true"] { background: var(--info-bg); color: var(--info); border-color: var(--info); }
.compare-toggle:disabled { opacity: .45; cursor: not-allowed; }
.cards { container-type: inline-size; }
@container (max-width: 720px) { .row { grid-template-columns: 96px 1fr; } .row .thumb { width: 96px; } .rowside { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; min-width: 0; } .rowside > * { max-width: 100%; } .ring { grid-row: auto; } }

.detail { border-top: 1px solid var(--line); }
.dhead { display: grid; grid-template-columns: 320px 1fr; }
@media (max-width: 760px) { .dhead { grid-template-columns: 1fr; } }
.photos .mainimg { aspect-ratio: 4/3; width: 100%; object-fit: cover; display: block; max-width: 100%; }
.photos .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--surface-2); }
.photos .thumbs img { aspect-ratio: 4/3; width: 100%; object-fit: cover; display: block; cursor: pointer; border-radius: 3px; opacity: .75; max-width: 100%; }
.photos .thumbs img.on { opacity: 1; outline: 2px solid var(--accent); }
.dfacts { padding: 14px 18px; display: grid; gap: 12px; min-width: 0; }
.specs { display: grid; grid-template-columns: 1fr; gap: 0; font-size: 13px; margin: 0; }
.specs div { display: grid; grid-template-columns: 128px 1fr; gap: 12px; border-bottom: 1px solid var(--line); padding: 6px 0; min-width: 0; }
.specs div:last-child { border-bottom: 0; }
.specs dt { color: var(--muted); } .specs dd { margin: 0; font-weight: 500; }
.travel { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.travel div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.travel b { display: block; font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a, .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; cursor: pointer; color: var(--fg); }
.links a.primary, .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.lactions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 4px; }
.dfacts h3, .col h3.sp { font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 0 0 6px; letter-spacing: 0; }
.col h3.sp { margin-top: 14px; }
.ctable { min-width: 0; font-size: 13px; }
.ctable th { cursor: default; }
.ctable td.good { color: var(--good); font-weight: 600; } .ctable td.bad, td.num.bad { color: var(--bad); font-weight: 600; } .ctable td.unk { color: var(--muted); }
.ctable i.sq { display: inline-block; width: 9px; height: 9px; margin-right: 6px; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.warnline { color: var(--warn); font-size: 12.5px; font-weight: 600; margin: 6px 0 0; }
.facts.afford { align-items: center; margin-top: 8px; font-size: 13px; }

.sx .err { color: var(--bad); font-size: 14px; white-space: pre-line; margin: 0; } .sx .hint { color: var(--muted); font-size: 13px; margin: 0; }
/* Redaction helper: full-screen dialog, pages stacked, black boxes drawn on an overlay canvas. */
dialog.sx.rd { margin: 0; width: 100%; max-width: none; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
.sx.rd form { height: 100%; max-height: none; }
.sx.rd .sxbody { max-height: none; flex: 1 1 0; background: var(--surface-2); }
.rd-pages { display: grid; gap: 18px; justify-items: center; padding-bottom: 8px; }
.rd-page { margin: 0; width: 100%; max-width: 900px; display: grid; gap: 6px; justify-items: center; }
.rd-stack { position: relative; width: 100%; box-shadow: 0 1px 6px rgba(16, 24, 40, .18); background: #fff; }
.rd-page.active .rd-stack { outline: 2px solid var(--accent); outline-offset: 2px; }
.rd-stack canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.rd-overlay { touch-action: none; cursor: crosshair; }
.rd-body.scrolling .rd-overlay { touch-action: pan-x pan-y pinch-zoom; cursor: default; }
.sx .rd-tools { flex-wrap: wrap; }
.rd-count { font-size: 13px; color: var(--muted); margin-left: auto; }
.rd-mode { display: none; }
@media (pointer: coarse) { .rd-mode { display: inline-flex; align-items: center; } }
@media (max-width: 560px) { .sx.rd .sxhead .hint { font-size: 12.5px; } .sx.rd .bar button { padding: 0 12px; } }
body.setup .wrap{display:none}
/* Area panel (public/area-ui.js) and the sources footer */
section.area { margin-top: 16px; min-width: 0; }
.area-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.area-head h3.sp { margin: 0; }
.area-places th, .area-places td:nth-child(-n+2) { white-space: normal; }
.area-places td:nth-child(2) { overflow-wrap: anywhere; }
.area-head .btn { margin-left: auto; padding: 4px 10px; font-size: 12.5px; }
.area-asof { font-size: 12px; }
.area-status { margin: 6px 0 0; font-size: 13px; }
.area-status:empty { display: none; }
.area-blocks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.area-fig { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.area-fig h4 { margin: 0 0 5px; font-size: 13px; font-weight: 600; }
.area-txt { margin: 0 0 4px; font-size: 13.5px; }
.area-txt.warn { color: var(--warn); font-weight: 600; }
.area-note { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.area-list { margin: 2px 0 4px 18px; padding: 0; font-size: 13px; }
.area-src { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.area-src a { color: inherit; }
.area-places { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.area-places table { width: 100%; min-width: 280px; }
.area-places th, .area-places td { padding: 6px 8px; vertical-align: top; }
.area-lines { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 6px; vertical-align: middle; }
.area-line { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--surface-3); cursor: help; }
.area-est { display: block; color: var(--muted); font-size: 11px; }
.bars .bl.tipped { cursor: help; text-decoration: underline dotted; }
footer.sources { margin-top: 18px; font-size: 12px; color: var(--muted); max-width: 90ch; }
footer.sources h3 { font-size: 12.5px; font-weight: 600; margin: 0 0 6px; }
footer.sources ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; overflow-wrap: anywhere; }
footer.sources b { font-weight: 600; color: var(--fg); }
footer.sources a { color: inherit; }
@media (max-width: 700px) { .area-head .btn { margin-left: 0; } }

  }
  function renderList(list) {

      if (hiddenN) { const p = el("p", "hiddenline", T.hiddenBy(hiddenN) + " "); const b = el("button", "linkish", T.showThem); b.type = "button"; b.onclick = () => { F.inCriteria = false; saveF(); render(); }; p.append(b); host.append(p); }
    }
    if (!list.length) { host.append(el("p", "empty", T.noMatch)); return; }
    list.forEach(c => host.append(card(c)));
  }
  function renderTable() {

    const rows = costSelected.map(id => listings.find(c => c.id === id)).filter(Boolean).sort((a, b) => { const x = val(a, tableSort.k), y = val(b, tableSort.k); if (x == null || y == null) return (x == null) - (y == null); return (typeof x === "string" ? x.localeCompare(y) : x - y) * tableSort.dir; });
    const thead = el("thead"); const hr = el("tr"); const numCols = [1, 3, 4, 5, 6, 7, 9];

    rows.forEach(c => { const tr = el("tr"); const td0 = el("td"); const a = el("a", null, titleOf(c)); a.href = "#listing-" + c.id; a.onclick = e => { e.preventDefault(); openListing(c.id); }; td0.append(a); if (c.pick) td0.append(document.createTextNode(" ✓")); tr.append(td0);
      const ts = el("td", "num"); ts.append(estTitle(el("span", "sc", scoreTxt(c)), c)); ts.firstChild.style.color = scoreColor(c.score); tr.append(ts);

      const ta = el("td"); ta.append(affordChip(c)); tr.append(ta);
      const tds = el("td"); tds.append(el("span", "pill s-" + c.status, T.status[c.status] || c.status)); tr.append(tds); tb.append(tr); });

  function render() {
    T = I18N[lang]; const list = visible(); renderHeader(); renderFilters(); renderWelcome(); renderStale(); syncAbout();
    if (!listings.length) return;
    renderKpis(list); renderDecision(list); renderMap(list); renderChart(list); renderUpdates(); renderCosts(list); renderList(list); renderTable();
    $("#compare").hidden = !costSelected.some(id => listings.some(c => c.id === id));
  }
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("flathunt-lang", lang); } catch (e) {} if (P) { render(); sendSwitch(); } });

  // ---------- saving ----------
  let saving = Promise.resolve();
  function send(id, method, path, body, noteEl) {
    saving = saving.then(() => fetch("/api/listings/" + encodeURIComponent(id) + path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
      .then(j => { raw[id] = j.listing; listings = toList(raw); render(); const n = noteEl && (document.querySelector(`#listing-${CSS.escape(id)} .saved`) || noteEl); if (n) { n.textContent = T.saved; setTimeout(() => n.textContent = "", 1500); } })
      .catch(e => { if (noteEl) noteEl.textContent = T.saveFail; });
  }
  const save = (id, patch, noteEl) => send(id, "PATCH", "", patch, noteEl);
  // Appended on the server, so messages the routine logged meanwhile are never overwritten by this page's copy.
  const addMessage = (id, message, noteEl) => send(id, "POST", "/messages", message, noteEl);
  function removeListing(c, noteEl) {
    if (!confirm(T.confirmDelete(titleOf(c)))) return;
    saving = saving.then(() => fetch("/api/listings/" + encodeURIComponent(c.id), { method: "DELETE" }).then(r => { if (!r.ok) throw new Error(r.status); }))
      .then(() => {
        expanded.delete(c.id); delete openReply[c.id]; delete openPhoto[c.id];
        if (costSelected.includes(c.id)) { costSelected = costSelected.filter(x => x !== c.id); saveCosts(); }
        if (location.hash === "#listing-" + c.id) history.replaceState(null, "", location.pathname + location.search);
        return load();
      })
      .catch(e => { if (noteEl) noteEl.textContent = T.saveFail; });
  }

  // ---------- load ----------
  // Score (or an estimate from the listing data), criteria check, red flags and affordability, recomputed for the whole set
  // because the "far below similar listings" flag compares each listing with the others.
  const toList = obj => {
    const arr = Object.entries(obj || {}).map(([id, d]) => ({ id, ...d }));
    arr.forEach(c => {
      c.score = Criteria.scoreListing(c, P.weights); c.scoreEstimated = false;
      if (c.score == null && !c.rating) { const e = Criteria.scoreListing({ rating: Criteria.estimateRating(c, P) }, P.weights); if (e != null) { c.score = e; c.scoreEstimated = true; } }
      c._crit = Criteria.checkCriteria(c, P, CAT, arr);
      const hit = c._crit.filter(r => r.key === "flag").map(r => r.def), ids = new Set(hit.map(d => d.id));
      // Flags the routine stored on the listing count too, even when the text no longer matches.
      (c.redFlags || []).forEach(id => { if (!ids.has(id)) { ids.add(id); hit.push(CAT.find(d => d.id === id) || { id, label: { en: id }, reason: {} }); } });
      c._flags = hit;
      c._afford = Money.affordability(monthlyOf(c), P);
    });
    return arr;
  };
  // ---------- area queue ----------
  // Listings whose area facts are queued or being computed; polled every 10 s while any are, and the listings reloaded when one finishes.
  let areaQueued = new Set(), areaPoll = null;
  async function fetchAreaQueue() {
    try { const r = await fetch("/api/area/queue", { cache: "no-store" }); if (!r.ok) return null; const j = await r.json(); return new Set([...(j.queued || []), j.running].filter(Boolean)); } catch (e) { return null; }
  }
  function setAreaQueue(s) {
    if (s) areaQueued = s;
    if (areaQueued.size && !areaPoll) areaPoll = setInterval(pollArea, 10000);
    else if (!areaQueued.size && areaPoll) { clearInterval(areaPoll); areaPoll = null; }
  }
  async function pollArea() {
    const s = await fetchAreaQueue(); if (!s) return;
    const done = [...areaQueued].some(id => !s.has(id)), added = [...s].some(id => !areaQueued.has(id));
    setAreaQueue(s);
    if (done) await refresh(); else if (added && P) render();
  }
  async function load() {
    try {
      const rp = await fetch("/api/profile", { cache: "no-store" });
      if (rp.status === 404) { document.body.classList.add("setup"); window.Setup && window.Setup.open({ mode: "wizard", lang, onSaved: () => location.reload() }); return; }
      if (!rp.ok) throw new Error(rp.status);
      P = await rp.json();
      try { CAT = await (await fetch("redflags.json")).json(); } catch (e) { CAT = []; }
      if (!P.languages.includes(lang)) { lang = P.languages[0]; T = I18N[lang]; }
      initFilters();
      const [r1, r2, q] = await Promise.all([fetch("/api/listings", { cache: "no-store" }), fetch("/api/meta", { cache: "no-store" }), fetchAreaQueue()]);
      if (!r1.ok) throw new Error(r1.status);
      setAreaQueue(q);
      raw = (await r1.json()).listings || {}; listings = toList(raw); if (r2.ok) meta = await r2.json();
      render(); sendSwitch();
      if (location.hash.startsWith("#listing-")) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView({ block: "start" }); }
      if (!window.__flathuntRefresh) window.__flathuntRefresh = setInterval(refresh, 60000);
    } catch (e) { console.warn(e); $("#cards").hidden = false; $("#cards").innerHTML = ""; $("#cards").append(el("p", "empty", T.loadFail)); }
  }
  // The header pause switch: status of the outreach routine; a 404 or an error hides it.
  async function sendSwitch() {
    const host = $("#sendsw");
    try {
      if (host.dataset.busy) return; // a pause request is in flight
      const r = await fetch("/api/outreach/status", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const status = await r.json();
      if (host.dataset.busy) return;
      OutreachUI.headerSwitch(host, { lang, status, onChanged: sendSwitch });
    } catch (e) { host.hidden = true; }
  }
  async function refresh() {
    sendSwitch();
    if (document.activeElement && document.activeElement.closest(".controls, .docs, .viewings, aside.filters, dialog")) return;
    try { const [r1, r2, q] = await Promise.all([fetch("/api/listings", { cache: "no-store" }), fetch("/api/meta", { cache: "no-store" }), fetchAreaQueue()]); setAreaQueue(q); if (r1.ok) { raw = (await r1.json()).listings || {}; listings = toList(raw); if (r2.ok) meta = await r2.json(); render(); } } catch (e) {}
